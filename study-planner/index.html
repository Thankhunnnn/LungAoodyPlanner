<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b192c">
  <meta name="description" content="ตัวช่วยวางแผนอ่านหนังสือ นับถอยหลังสอบ จัดตาราง และติวด้วย AI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LungAoodyPlanner 🐃">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="LungAoodyPlanner 🐃">
  <meta name="twitter:title" content="LungAoodyPlanner 🐃">
  <meta property="og:description" content="ตัวช่วยวางแผนอ่านหนังสือ นับถอยหลังสอบ จัดตาราง และติวด้วย AI">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lungaoodyplanner.netlify.app/assets/og.jpg">
  <title>LungAoodyPlanner 🐃</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/avatar-profile.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="sticker s-rocket"></span>
    <span class="sticker s-book"></span>
    <span class="sticker s-pencil"></span>
    <span class="sticker s-sakura"></span>
  </div>
  <div class="app">
    <div class="gutter gutter-right" id="gutterRight"></div>
    <header id="header" class="header"></header>
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
  </div>

  <div id="fabWrap" class="fab-wrap">
    <div id="fabMenu" class="fab-menu" hidden>
      <button type="button" class="fab-item" data-act="fab-pick" data-go="todo">+ เพิ่มสิ่งที่ต้องทำ</button>
      <button type="button" class="fab-item" data-act="fab-pick" data-go="subject">+ เพิ่มวิชา</button>
      <button type="button" class="fab-item" data-act="fab-pick" data-go="timer">⏱️ จับเวลา / บันทึกเวลา</button>
    </div>
    <button type="button" id="fabBtn" class="fab-btn" data-act="toggle-fab" aria-label="เมนูลัดเพิ่มรายการ" aria-expanded="false">+</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle" hidden></h3><div class="row" style="margin:0;gap:6px"><button id="modalBack" class="icon-btn" data-act="modal-back" aria-label="ย้อนกลับ" hidden><svg class="svg-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-btn" data-act="close-modal" aria-label="ปิดหน้าต่าง"><svg class="svg-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
