<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b192c">
  <meta name="description" content="ตัวช่วยวางแผนอ่านหนังสือ นับถอยหลังสอบ จัดตาราง และติวด้วย AI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LungAoodyPlanner 🐃">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="LungAoodyPlanner 🐃">
  <meta name="twitter:title" content="LungAoodyPlanner 🐃">
  <meta property="og:description" content="ตัวช่วยวางแผนอ่านหนังสือ นับถอยหลังสอบ จัดตาราง และติวด้วย AI">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lungaoodyplanner.netlify.app/assets/og.jpg">
  <title>LungAoodyPlanner 🐃</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/avatar-profile.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="sticker s-rocket"></span>
    <span class="sticker s-book"></span>
    <span class="sticker s-pencil"></span>
    <span class="sticker s-sakura"></span>
  </div>
  <div class="app">
    <div class="gutter gutter-right" id="gutterRight"></div>
    <header id="header" class="header"></header>
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
  </div>

  <div id="bubbleBackdrop" class="bubble-backdrop" data-act="close-bubbles" hidden></div>

  <div id="fabWrap" class="fab-wrap">
    <div id="fabMenu" class="bubble-stack fab-stack" hidden>
      <button type="button" class="bubble-item" style="--i:2" data-act="fab-pick" data-go="timer"><span class="bubble-pill">จับเวลา / บันทึกเวลา</span><span class="bubble-ic">⏱️</span></button>
      <button type="button" class="bubble-item" style="--i:1" data-act="fab-pick" data-go="subject"><span class="bubble-pill">เพิ่มวิชา</span><span class="bubble-ic">📚</span></button>
      <button type="button" class="bubble-item" style="--i:0" data-act="fab-pick" data-go="todo"><span class="bubble-pill">เพิ่มสิ่งที่ต้องทำ</span><span class="bubble-ic">✅</span></button>
    </div>
    <button type="button" id="fabBtn" class="bubble-trigger fab-btn" data-act="toggle-fab" aria-label="เมนูลัดเพิ่มรายการ" aria-expanded="false">+</button>
  </div>

  <div id="mobMenuWrap" class="mob-menu-wrap">
    <div id="mobNavStack" class="bubble-stack" hidden></div>
    <button type="button" id="mobMenuBtn" class="bubble-trigger menu-trigger" data-act="toggle-mob-nav" aria-label="เปิดเมนูนำทาง" aria-expanded="false">≡</button>
  </div>

  <div id="focusOverlay" class="focus-overlay" hidden>
    <div class="focus-top">
      <div class="focus-meta">
        <span id="focusModeChip" class="chip accent">โฟกัส</span>
        <b id="focusSubj">อ่านหนังสือ</b>
      </div>
      <div class="row wrap" style="margin:0;gap:6px">
        <button type="button" class="btn ghost small" data-act="focus-flip-toggle">🕒 Flip Clock</button>
        <button type="button" class="btn ghost small" data-act="focus-sound-toggle">🎧 เสียงบรรยากาศ</button>
        <button type="button" class="btn ghost small" data-act="focus-formula-toggle">📖 สูตรด่วน</button>
        <button type="button" class="btn ghost small" data-act="focus-close">✕ ออก</button>
      </div>
    </div>
    <div id="focusSoundPanel" class="focus-sound-panel" hidden>
      <div class="sound-row"><span>🌧️ ฝนตก</span><input type="range" min="0" max="100" value="0" data-sound="rain" aria-label="ระดับเสียงฝนตก"></div>
      <div class="sound-row"><span>☕ คาเฟ่</span><input type="range" min="0" max="100" value="0" data-sound="cafe" aria-label="ระดับเสียงคาเฟ่"></div>
      <div class="sound-row"><span>🌊 คลื่นทะเล</span><input type="range" min="0" max="100" value="0" data-sound="ocean" aria-label="ระดับเสียงคลื่นทะเล"></div>
      <div class="sound-row"><span>📻 Brown Noise</span><input type="range" min="0" max="100" value="0" data-sound="brown" aria-label="ระดับเสียง Brown Noise"></div>
      <div class="row end" style="margin-top:6px"><button type="button" class="btn ghost small" data-act="sound-mute">🔇 ปิด/เปิดเสียง</button></div>
    </div>
    <div class="focus-center">
      <div id="focusRing" class="focus-ring work">
        <div class="focus-ring-inner">
          <div id="focusDisplay" class="focus-time">25:00</div>
          <div id="focusHint" class="muted">รอบที่ 1 · ตั้งใจอ่านนะ</div>
        </div>
      </div>
      <div id="focusFlip" class="focus-flip" hidden>
        <div class="flip-card"><span id="flipMin">25</span><small>MIN</small></div>
        <div class="flip-colon">:</div>
        <div class="flip-card"><span id="flipSec">00</span><small>SEC</small></div>
      </div>
      <div class="row center wrap focus-ctrls">
        <button type="button" id="focusStartBtn" class="btn big" data-act="timer-start">▶ เริ่ม</button>
        <button type="button" class="btn ghost" data-act="timer-reset">รีเซ็ต</button>
        <button type="button" class="btn ghost" data-act="timer-stoplog">หยุด+บันทึก</button>
        <button type="button" id="focusSkipBtn" class="btn ghost" data-act="timer-skip">ข้าม</button>
      </div>
    </div>
    <aside id="focusFormulaDrawer" class="focus-formula-drawer" hidden>
      <div class="card-head">
        <h3>📖 สูตร &amp; สรุปด่วน</h3>
        <button type="button" class="icon-btn" data-act="focus-formula-toggle" aria-label="ปิดลิ้นชักสูตร">✕</button>
      </div>
      <div id="focusFormulaBody"></div>
    </aside>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle" hidden></h3><div class="row" style="margin:0;gap:6px"><button id="modalBack" class="icon-btn" data-act="modal-back" aria-label="ย้อนกลับ" hidden><svg class="svg-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-btn" data-act="close-modal" aria-label="ปิดหน้าต่าง"><svg class="svg-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/services.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
